[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-lakehouse"
version = "0.1.0"
description = "Medallion (bronze/silver/gold) lakehouse pipeline on Spark and Delta Lake, runnable locally and on Databricks/AWS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyspark>=4.0,<5",
    "delta-spark>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
flight-lakehouse = "flight_lakehouse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# Databricks notebooks use notebook-only globals (dbutils, display)
extend-exclude = ["databricks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
